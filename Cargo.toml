[package]
name = "quickstart" # hot-reload requires package.name to match bin.name, so it can find the dynamic library
version = "0.1.0"
authors = [""]
edition = "2024"
resolver = "2"

[profile.dev.package."*"]
opt-level = 2

[lib]
path = "src/lib.rs"
crate-type = ["lib", "dylib"]

[[bin]]
name = "quickstart" # <-- bin.name
path = "src/main.rs"

[dependencies]
env_logger = "0.11.8"
rosin = { path = "../rosin/rosin", features = ["hot-reload"] } # TODO - use published version
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
